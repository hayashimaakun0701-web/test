<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <title>REXX 点数読み取りテスト v0.3.1</title>
  <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"
          integrity="sha384-1zP4ZOtlk2FXAOiUArpMuWf7INJJKe/ROfYFAVSeUa11DEfXdKWGiPI3dVma2Gt0"
          crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
    }
    .container {
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 16px;
      text-align: center;
      margin: 4px 0 12px;
      color: #ccc;
    }
    h2 {
      font-size: 14px;
      color: #888;
      margin: 16px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas.hidden { display: none; }
    .guide-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #4a9eff;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.3);
      transition: width 0.2s, height 0.2s;
    }
    /* 点数の4桁だけが収まる横長・狭めの枠。JSの GUIDE_SIZES と必ず一致させること。 */
    .guide-S { width: 40%; height: 22%; }
    .guide-M { width: 52%; height: 28%; }
    .guide-L { width: 66%; height: 36%; }
    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }
    .controls-row {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 14px 8px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #4a9eff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.secondary { background: #444; }
    button.danger { background: #c44; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.small {
      padding: 8px 12px;
      font-size: 13px;
    }
    label {
      font-size: 13px;
      color: #aaa;
    }
    select, input[type="range"] {
      padding: 6px;
      font-size: 14px;
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
    }
    input[type="range"] { padding: 0; }
    .switch {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #ccc;
    }
    .switch input { width: auto; }
    .result {
      margin-top: 12px;
      padding: 16px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    .result-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .result-value {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      color: #4a9eff;
      font-family: "SF Mono", Consolas, monospace;
      line-height: 1.1;
      word-break: break-all;
    }
    .result-converted {
      text-align: center;
      font-size: 18px;
      color: #ccc;
      margin-top: 8px;
    }
    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      min-height: 1.4em;
    }
    .status.ok { color: #4ade80; }
    .status.warn { color: #fbbf24; }
    .status.error { color: #ff6b6b; }
    .preview {
      margin-top: 12px;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    .preview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .preview-col img {
      width: 100%;
      border-radius: 6px;
      background: #000;
    }
    .preview-col-label {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-bottom: 4px;
    }
    .preview-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .threshold-control {
      margin-top: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .threshold-control input { width: 100%; }
    .ocr-detail {
      margin-top: 8px;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
    .psm-results {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .psm-card {
      padding: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
      color: #888;
    }
    .psm-card.best {
      background: #1e3a1e;
      border: 1px solid #4ade80;
      color: #fff;
    }
    .psm-card .text {
      font-size: 18px;
      font-weight: bold;
      color: #4a9eff;
      font-family: monospace;
      margin: 4px 0;
    }
    .history {
      margin-top: 16px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-count {
      font-size: 12px;
      color: #888;
    }
    .history-actions {
      display: flex;
      gap: 6px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 10px;
      padding: 8px;
      background: #2a2a2a;
      border-radius: 6px;
      align-items: center;
    }
    .history-item img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      background: #000;
    }
    .history-info {
      font-size: 12px;
      color: #ccc;
    }
    .history-info .time {
      color: #888;
      font-size: 10px;
    }
    .history-info .text {
      font-size: 18px;
      font-weight: bold;
      color: #4a9eff;
      font-family: monospace;
      margin: 2px 0;
    }
    .history-info .conf {
      font-size: 11px;
    }
    .empty-history {
      text-align: center;
      color: #666;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>REXX 点数読み取りテスト v0.3.1</h1>

    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide-overlay guide-M" id="guide"></div>
      <canvas id="captureCanvas" class="hidden"></canvas>
      <canvas id="processCanvas" class="hidden"></canvas>
    </div>

    <div class="controls">
      <button id="captureBtn" disabled>撮影して読み取る</button>
      <button id="switchBtn" class="secondary">カメラ切替</button>
    </div>

    <div class="controls-row">
      <label for="guideSize">枠サイズ:</label>
      <select id="guideSize">
        <option value="S">S (小)</option>
        <option value="M" selected>M (中)</option>
        <option value="L">L (大)</option>
      </select>

      <label class="switch">
        <input type="checkbox" id="autoThreshold" checked>
        自動閾値 (Otsu)
      </label>

      <label class="switch">
        <input type="checkbox" id="useSeven">
        7セグモデル(実験)
      </label>
    </div>

    <div class="threshold-control">
      <label>閾値:</label>
      <input type="range" id="thresholdSlider" min="0" max="255" value="128" disabled>
      <span id="thresholdValue" style="min-width:30px;text-align:right;font-family:monospace">128</span>
    </div>

    <div class="result">
      <div class="result-label">認識結果（パネル表示）</div>
      <div class="result-value" id="resultValue">--</div>
      <div class="result-converted" id="resultConverted">実点数: --</div>
      <div class="status" id="status">カメラ準備中...</div>
    </div>

    <div class="preview" id="previewWrapper" style="display:none">
      <div class="result-label">撮影画像（最新）</div>
      <div class="preview-row">
        <div class="preview-col">
          <div class="preview-col-label">元画像</div>
          <img id="previewOriginal" alt="original" />
        </div>
        <div class="preview-col">
          <div class="preview-col-label">前処理後（OCRに送信）</div>
          <img id="previewProcessed" alt="processed" />
        </div>
      </div>
      <div class="preview-actions">
        <button class="secondary small" id="downloadBtn">画像をダウンロード</button>
      </div>
      <div class="ocr-detail" id="ocrDetail">PSMモード別の結果がここに表示されます</div>
      <div class="psm-results" id="psmResults"></div>
    </div>

    <div class="history">
      <h2>撮影履歴</h2>
      <div class="history-header">
        <span class="history-count" id="historyCount">0件</span>
        <div class="history-actions">
          <button class="secondary small" id="exportBtn">ログ全体をエクスポート</button>
          <button class="danger small" id="clearBtn">クリア</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">まだ撮影履歴はありません</div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // DOM参照
    // ============================================================
    const video = document.getElementById('video');
    const captureCanvas = document.getElementById('captureCanvas');
    const processCanvas = document.getElementById('processCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const guide = document.getElementById('guide');
    const guideSize = document.getElementById('guideSize');
    const autoThreshold = document.getElementById('autoThreshold');
    const useSeven = document.getElementById('useSeven');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdValue = document.getElementById('thresholdValue');
    const resultValue = document.getElementById('resultValue');
    const resultConverted = document.getElementById('resultConverted');
    const statusEl = document.getElementById('status');
    const previewOriginal = document.getElementById('previewOriginal');
    const previewProcessed = document.getElementById('previewProcessed');
    const previewWrapper = document.getElementById('previewWrapper');
    const downloadBtn = document.getElementById('downloadBtn');
    const ocrDetail = document.getElementById('ocrDetail');
    const psmResults = document.getElementById('psmResults');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    // ============================================================
    // 定数・状態
    // ============================================================
    const STORAGE_KEY = 'score-reader-history-v1';
    const MAX_HISTORY = 10;
    const PSM_MODES = [
      { value: '7',  label: 'PSM 7\nsingle line' },
      { value: '8',  label: 'PSM 8\nsingle word' },
      { value: '13', label: 'PSM 13\nraw line' }
    ];
    // ガイド枠サイズ（表示枠に対する割合）。
    // 点数の4桁だけが収まるよう、横長・狭めに設定。CSSの .guide-S/M/L と必ず一致させること。
    const GUIDE_SIZES = {
      S: { w: 0.40, h: 0.22 },
      M: { w: 0.52, h: 0.28 },
      L: { w: 0.66, h: 0.36 }
    };

    let stream = null;
    let worker = null;
    let useFrontCamera = false;
    let lastCapture = null; // {original, processed, timestamp}

    // ============================================================
    // カメラ
    // ============================================================
    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: useFrontCamera ? 'user' : { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        setStatus('カメラ準備完了。', '');
        return true;
      } catch (err) {
        setStatus('カメラ起動失敗: ' + err.message, 'error');
        return false;
      }
    }

    // ============================================================
    // OCR初期化
    // ============================================================
    async function initOCR() {
      setStatus('OCRエンジン読み込み中...', '');
      try {
        // 7セグモデルを試す場合
        if (useSeven.checked) {
          try {
            worker = await Tesseract.createWorker('letsgodigital', 1, {
              langPath: 'https://cdn.jsdelivr.net/gh/Shreeshrii/tessdata_shreetest@master/'
            });
            setStatus('7セグモデルで準備完了', 'ok');
          } catch (e) {
            console.warn('7seg load failed, falling back to eng:', e);
            worker = await Tesseract.createWorker('eng');
            setStatus('7セグモデル読み込み失敗→標準モデルで準備完了', 'warn');
          }
        } else {
          worker = await Tesseract.createWorker('eng');
          setStatus('標準モデルで準備完了', '');
        }

        await worker.setParameters({
          tessedit_char_whitelist: '0123456789-'
        });
        captureBtn.disabled = false;
      } catch (err) {
        setStatus('OCRエンジン読み込み失敗: ' + err.message, 'error');
      }
    }

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    // ============================================================
    // ガイド領域の切り出し
    // ============================================================
    function cropToGuide() {
      const size = GUIDE_SIZES[guideSize.value];
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      // object-fit:cover による「画面で見えている範囲」と「生映像」のズレを補正する。
      // ガイド枠は画面(表示枠)基準で描かれているので、表示枠で実際に見えている
      // 生映像の割合(visW / visH)を掛けてから切り取らないと、上下(または左右)の
      // 隠れた部分まで巻き込んでしまう。
      const rect = video.getBoundingClientRect();
      const boxRatio = (rect.width && rect.height) ? rect.width / rect.height : vw / vh;
      const videoRatio = vw / vh;
      let visW = 1, visH = 1;
      if (videoRatio > boxRatio) {
        visW = boxRatio / videoRatio;   // 横長映像 → 左右が隠れている
      } else {
        visH = videoRatio / boxRatio;   // 縦長映像 → 上下が隠れている
      }

      const cropW = vw * size.w * visW;
      const cropH = vh * size.h * visH;
      const cropX = (vw - cropW) / 2;
      const cropY = (vh - cropH) / 2;
      captureCanvas.width  = cropW;
      captureCanvas.height = cropH;
      captureCanvas.getContext('2d').drawImage(
        video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH
      );
      return captureCanvas;
    }

    // ============================================================
    // 画像前処理パイプライン
    // 赤チャンネル抽出 → 閾値 → 二値化 → 反転
    // ============================================================
    function preprocessImage(srcCanvas) {
      const w = srcCanvas.width;
      const h = srcCanvas.height;
      processCanvas.width = w;
      processCanvas.height = h;
      const srcCtx = srcCanvas.getContext('2d');
      const dstCtx = processCanvas.getContext('2d');
      const srcData = srcCtx.getImageData(0, 0, w, h);
      const dstData = dstCtx.createImageData(w, h);

      // 閾値を決定
      let threshold;
      if (autoThreshold.checked) {
        threshold = otsuThreshold(srcData.data);
        thresholdSlider.value = threshold;
        thresholdValue.textContent = threshold;
      } else {
        threshold = parseInt(thresholdSlider.value, 10);
      }

      // 赤チャンネル抽出 + 二値化 + 反転
      // 赤LED表示なので、Rが強い = 数字。それを反転して「黒地白字」→「白地黒字」へ
      for (let i = 0; i < srcData.data.length; i += 4) {
        const r = srcData.data[i];
        const value = r > threshold ? 0 : 255; // 反転含む
        dstData.data[i]     = value;
        dstData.data[i + 1] = value;
        dstData.data[i + 2] = value;
        dstData.data[i + 3] = 255;
      }
      dstCtx.putImageData(dstData, 0, 0);
      return processCanvas;
    }

    // ============================================================
    // Otsu法による自動閾値算出
    // ============================================================
    function otsuThreshold(data) {
      const histogram = new Array(256).fill(0);
      let total = 0;
      for (let i = 0; i < data.length; i += 4) {
        histogram[data[i]]++; // Rチャンネルのみ
        total++;
      }

      let sumTotal = 0;
      for (let i = 0; i < 256; i++) sumTotal += i * histogram[i];

      let sumB = 0, wB = 0;
      let maxVariance = 0;
      let level = 0;

      for (let t = 0; t < 256; t++) {
        wB += histogram[t];
        if (wB === 0) continue;
        const wF = total - wB;
        if (wF === 0) break;

        sumB += t * histogram[t];
        const mB = sumB / wB;
        const mF = (sumTotal - sumB) / wF;
        const variance = wB * wF * Math.pow(mB - mF, 2);

        if (variance > maxVariance) {
          maxVariance = variance;
          level = t;
        }
      }
      return level;
    }

    // ============================================================
    // 複数PSMモードでOCR実行
    // ============================================================
    async function recognizeMultiPSM(canvas) {
      const results = [];
      for (const psm of PSM_MODES) {
        try {
          await worker.setParameters({
            tessedit_pageseg_mode: psm.value,
            tessedit_char_whitelist: '0123456789-'
          });
          const { data } = await worker.recognize(canvas);
          const text = (data.text || '').replace(/\s+/g, '').trim();
          const confidence = data.confidence || 0;
          results.push({ psm: psm.value, label: psm.label, text, confidence });
        } catch (err) {
          results.push({ psm: psm.value, label: psm.label, text: '(error)', confidence: 0 });
        }
      }
      return results;
    }

    // 最良結果を選ぶ（信頼度最高 + テキストが空でないもの優先）
    function pickBest(results) {
      const nonEmpty = results.filter(r => r.text && r.text.length > 0);
      if (nonEmpty.length === 0) return results[0];
      return nonEmpty.reduce((a, b) => (a.confidence >= b.confidence ? a : b));
    }

    // ============================================================
    // 撮影 + 認識 + 履歴保存
    // ============================================================
    async function captureAndRecognize() {
      if (!worker) return;
      captureBtn.disabled = true;
      setStatus('認識中...', '');
      resultValue.textContent = '...';
      resultConverted.textContent = '実点数: --';
      ocrDetail.textContent = '';
      psmResults.innerHTML = '';

      const original = cropToGuide();
      const processed = preprocessImage(original);

      const originalDataUrl = original.toDataURL('image/jpeg', 0.8);
      const processedDataUrl = processed.toDataURL('image/jpeg', 0.8);
      const timestamp = new Date().toISOString();
      lastCapture = { original: originalDataUrl, processed: processedDataUrl, timestamp };

      previewOriginal.src = originalDataUrl;
      previewProcessed.src = processedDataUrl;
      previewWrapper.style.display = 'block';

      try {
        const results = await recognizeMultiPSM(processed);
        const best = pickBest(results);

        resultValue.textContent = best.text || '(測定不能)';

        const num = parseInt(best.text, 10);
        if (!isNaN(num)) {
          resultConverted.textContent = `実点数: ${(num * 100).toLocaleString()} 点`;
        } else {
          resultConverted.textContent = '実点数: 変換不可';
        }

        const confType = best.confidence > 60 ? 'ok' : best.confidence > 30 ? 'warn' : 'error';
        setStatus(`最良: PSM${best.psm} / 信頼度: ${best.confidence.toFixed(1)}%`, confType);

        // PSM別カード表示
        psmResults.innerHTML = results.map(r => `
          <div class="psm-card${r === best ? ' best' : ''}">
            <div>PSM ${r.psm}</div>
            <div class="text">${r.text || '∅'}</div>
            <div>${r.confidence.toFixed(0)}%</div>
          </div>
        `).join('');

        // 詳細
        ocrDetail.textContent = JSON.stringify({
          best: { psm: best.psm, text: best.text, confidence: best.confidence },
          allResults: results.map(r => ({ psm: r.psm, text: r.text, confidence: Math.round(r.confidence) })),
          threshold: parseInt(thresholdSlider.value, 10),
          guideSize: guideSize.value,
          useSeven: useSeven.checked
        }, null, 2);

        // 履歴保存
        saveToHistory({
          timestamp,
          imageDataUrl: originalDataUrl,
          processedDataUrl,
          recognizedText: best.text,
          confidence: best.confidence,
          realPoints: isNaN(num) ? null : num * 100,
          bestPsm: best.psm,
          allResults: results.map(r => ({ psm: r.psm, text: r.text, confidence: Math.round(r.confidence) })),
          threshold: parseInt(thresholdSlider.value, 10),
          guideSize: guideSize.value,
          useSeven: useSeven.checked
        });
      } catch (err) {
        resultValue.textContent = 'エラー';
        setStatus(err.message, 'error');
      } finally {
        captureBtn.disabled = false;
      }
    }

    // ============================================================
    // 履歴管理
    // ============================================================
    function saveToHistory(entry) {
      let history = loadHistory();
      history.unshift(entry);
      if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      } catch (err) {
        console.warn('履歴の保存に失敗（容量超過の可能性）:', err);
      }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }

    function clearHistory() {
      if (!confirm('履歴をすべて削除しますか？')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }

    function renderHistory() {
      const history = loadHistory();
      historyCount.textContent = `${history.length}件`;
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">まだ撮影履歴はありません</div>';
        return;
      }
      historyList.innerHTML = history.map((h, i) => {
        const time = new Date(h.timestamp).toLocaleString('ja-JP', { hour12: false });
        const confColor = h.confidence > 60 ? '#4ade80' : h.confidence > 30 ? '#fbbf24' : '#ff6b6b';
        const text = h.recognizedText || '(測定不能)';
        const realPts = h.realPoints !== null ? `${h.realPoints.toLocaleString()}点` : '-';
        return `
          <div class="history-item">
            <img src="${h.imageDataUrl}" alt="capture" />
            <div class="history-info">
              <div class="time">${time} (${h.guideSize}/閾値${h.threshold ?? '-'}/${h.useSeven ? '7seg' : 'eng'})</div>
              <div class="text">${text}</div>
              <div class="conf">実点数: ${realPts} / 信頼度: <span style="color:${confColor}">${h.confidence.toFixed(1)}%</span> / 最良PSM: ${h.bestPsm ?? '-'}</div>
            </div>
            <button class="secondary small" data-index="${i}">DL</button>
          </div>
        `;
      }).join('');

      historyList.querySelectorAll('button[data-index]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index, 10);
          const h = history[idx];
          downloadImage(h.imageDataUrl, `capture_${h.timestamp.replace(/[:.]/g, '-')}.jpg`);
        });
      });
    }

    function downloadImage(dataUrl, filename) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadCurrentImage() {
      if (!lastCapture) return;
      downloadImage(
        lastCapture.original,
        `capture_${lastCapture.timestamp.replace(/[:.]/g, '-')}.jpg`
      );
    }

    function exportHistory() {
      const history = loadHistory();
      if (history.length === 0) { alert('履歴が空です'); return; }
      const exportData = {
        exportedAt: new Date().toISOString(),
        appVersion: 'v0.3.1',
        entryCount: history.length,
        entries: history
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `score-reader-log_${Date.now()}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // ============================================================
    // イベント
    // ============================================================
    guideSize.addEventListener('change', () => {
      guide.className = 'guide-overlay guide-' + guideSize.value;
    });

    autoThreshold.addEventListener('change', () => {
      thresholdSlider.disabled = autoThreshold.checked;
    });

    thresholdSlider.addEventListener('input', () => {
      thresholdValue.textContent = thresholdSlider.value;
    });

    useSeven.addEventListener('change', async () => {
      captureBtn.disabled = true;
      if (worker) { try { await worker.terminate(); } catch {} worker = null; }
      await initOCR();
    });

    captureBtn.addEventListener('click', captureAndRecognize);
    switchBtn.addEventListener('click', async () => {
      useFrontCamera = !useFrontCamera;
      await startCamera();
    });
    downloadBtn.addEventListener('click', downloadCurrentImage);
    exportBtn.addEventListener('click', exportHistory);
    clearBtn.addEventListener('click', clearHistory);

    // 初期化
    (async () => {
      renderHistory();
      const ok = await startCamera();
      if (ok) await initOCR();
    })();
  </script>
</body>
</html>
