<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <title>REXX 点数読み取りテスト v0.1</title>
  <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
    }
    .container {
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 16px;
      text-align: center;
      margin: 4px 0 12px;
      color: #ccc;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas#captureCanvas { display: none; }
    .guide-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 25%;
      border: 2px solid #4a9eff;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.3);
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4a9eff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.secondary {
      background: #444;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .result {
      margin-top: 12px;
      padding: 16px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    .result-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .result-value {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      color: #4a9eff;
      font-family: "SF Mono", Consolas, monospace;
      line-height: 1.1;
      word-break: break-all;
    }
    .result-converted {
      text-align: center;
      font-size: 18px;
      color: #ccc;
      margin-top: 8px;
    }
    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      min-height: 1.4em;
    }
    .preview {
      margin-top: 12px;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 8px;
    }
    .preview img {
      width: 100%;
      border-radius: 6px;
      margin-top: 8px;
    }
    .error {
      color: #ff6b6b;
    }
    .ok {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>REXX 点数読み取りテスト v0.1</h1>

    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide-overlay" id="guide"></div>
      <canvas id="captureCanvas"></canvas>
    </div>

    <div class="controls">
      <button id="captureBtn" disabled>撮影して読み取る</button>
      <button id="switchBtn" class="secondary">カメラ切替</button>
    </div>

    <div class="result">
      <div class="result-label">認識結果（パネル表示）</div>
      <div class="result-value" id="resultValue">--</div>
      <div class="result-converted" id="resultConverted">実点数: --</div>
      <div class="status" id="status">カメラ準備中...</div>
    </div>

    <div class="preview" id="previewWrapper" style="display:none">
      <div class="result-label">撮影画像（デバッグ用）</div>
      <img id="preview" alt="capture" />
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const captureCanvas = document.getElementById('captureCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const resultValue = document.getElementById('resultValue');
    const resultConverted = document.getElementById('resultConverted');
    const statusEl = document.getElementById('status');
    const guide = document.getElementById('guide');
    const preview = document.getElementById('preview');
    const previewWrapper = document.getElementById('previewWrapper');

    let stream = null;
    let worker = null;
    let useFrontCamera = false;

    // カメラ起動
    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: useFrontCamera ? 'user' : { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        statusEl.textContent = 'カメラ準備完了。点数表示を青枠に入れて撮影してください。';
        statusEl.className = 'status';
        return true;
      } catch (err) {
        statusEl.textContent = 'カメラ起動失敗: ' + err.message;
        statusEl.className = 'status error';
        console.error(err);
        return false;
      }
    }

    // OCRエンジン初期化
    async function initOCR() {
      statusEl.textContent = 'OCRエンジン読み込み中...';
      try {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789-',
          tessedit_pageseg_mode: '7'  // 1行とみなす
        });
        captureBtn.disabled = false;
        statusEl.textContent = '準備完了。点数表示を青枠に入れて撮影してください。';
      } catch (err) {
        statusEl.textContent = 'OCRエンジン読み込み失敗: ' + err.message;
        statusEl.className = 'status error';
        console.error(err);
      }
    }

    // ガイド枠の領域だけを切り出す
    function cropToGuide() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      // ガイド枠と同じ比率で中央60%×25%を切り出し
      const cropW = vw * 0.6;
      const cropH = vh * 0.25;
      const cropX = (vw - cropW) / 2;
      const cropY = (vh - cropH) / 2;

      captureCanvas.width = cropW;
      captureCanvas.height = cropH;
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      return captureCanvas;
    }

    // 撮影 + OCR
    async function captureAndRecognize() {
      if (!worker) return;
      captureBtn.disabled = true;
      statusEl.textContent = '認識中...';
      statusEl.className = 'status';
      resultValue.textContent = '...';
      resultConverted.textContent = '実点数: --';

      const canvas = cropToGuide();

      // プレビュー表示
      preview.src = canvas.toDataURL('image/png');
      previewWrapper.style.display = 'block';

      try {
        const { data } = await worker.recognize(canvas);
        const text = (data.text || '').replace(/\s+/g, '').trim();
        const confidence = data.confidence ? data.confidence.toFixed(1) : '0';

        resultValue.textContent = text || '(認識できず)';

        // 実点数に変換（×100）
        const num = parseInt(text, 10);
        if (!isNaN(num)) {
          resultConverted.textContent = `実点数: ${(num * 100).toLocaleString()} 点`;
        } else {
          resultConverted.textContent = '実点数: 変換不可';
        }

        statusEl.textContent = `信頼度: ${confidence}%`;
        statusEl.className = parseFloat(confidence) > 60 ? 'status ok' : 'status error';
      } catch (err) {
        resultValue.textContent = 'エラー';
        statusEl.textContent = err.message;
        statusEl.className = 'status error';
        console.error(err);
      } finally {
        captureBtn.disabled = false;
      }
    }

    // カメラ切替
    async function switchCamera() {
      useFrontCamera = !useFrontCamera;
      await startCamera();
    }

    captureBtn.addEventListener('click', captureAndRecognize);
    switchBtn.addEventListener('click', switchCamera);

    // 初期化
    (async () => {
      const ok = await startCamera();
      if (ok) await initOCR();
    })();
  </script>
</body>
</html>
